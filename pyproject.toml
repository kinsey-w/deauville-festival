[project]
name = "deauville"
version = "0.1.0"
description = "Festival scheduling, command line and web administration"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.146.0",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
deauville = "deauville.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deauville"]

[dependency-groups]
dev = [
    "httpx2>=2.15.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
